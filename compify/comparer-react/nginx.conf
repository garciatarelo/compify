server {
    listen 80;
    server_name _;

    # Servir archivos estáticos del frontend React/Vite
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para las peticiones a la API
    # Redirige todo lo que empiece con /api/ al contenedor backend
    location /api/ {
        proxy_pass http://backend/api/;
        
        # Cabeceras para que el backend reconozca la petición original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
